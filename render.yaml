services:
  - type: web
    # Renaming the service is what gets a fresh https://<name>.onrender.com URL;
    # Render treats a new name as a new service rather than reusing the old one.
    name: akash-portfolio
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      # Disables the development-only loopback CORS allowance.
      - key: ENVIRONMENT
        value: production
      # No disk: free-tier services cannot mount one, so the SQLite file lives on
      # the container's ephemeral filesystem and is lost on every restart, deploy
      # and spin-down. The admin user and the starter seminar are re-seeded at
      # boot, but anything added through the admin panel will not survive. Move to
      # a managed Postgres (and add psycopg2-binary to backend/requirements.txt)
      # when the content needs to persist.
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db
      # The SPA and the API are served from the same origin by this container, so
      # the browser never makes a cross-origin request and no origin needs to be
      # allow-listed. Add genuinely external front-ends here if any appear; never
      # "*", which is invalid alongside allow_credentials.
      - key: CORS_ORIGINS
        value: ""
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
