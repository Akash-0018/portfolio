services:
  - type: web
    name: portfolio-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
    disk:
      name: portfolio-db-data
      mountPath: /app/data
      sizeGB: 1
