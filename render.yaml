services:
  - type: web
    name: portfolio-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      # Disables the development-only loopback CORS allowance.
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db
      # The SPA is served from this same origin, so CORS only needs to list
      # genuinely external front-ends. Never "*" alongside allow_credentials.
      - key: CORS_ORIGINS
        value: "https://akash-aiportfolio.netlify.app"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
    disk:
      name: portfolio-db-data
      mountPath: /app/data
      sizeGB: 1
